name: Build and Deploy Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "data/**"
      - "tools/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build compiled data
        run: node tools/build-compiled-data.js

      - name: Prepare lean Pages artifact
        run: node tools/prepare-pages-artifact.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .pages-dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
